[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["crates/dashboard"]

[workspace.package]
authors = ["Owen Fulton <fultonowen@gmail.com>"]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"

[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
async-graphql-axum = "7.2.1"
async-graphql = "7.2.1"
bytes = "1.12.1"
chrono = "0.4.45"
config = "0.15.27"
cynic = "3.14.0"
graphql_client = "0.16.0"
futures-util = "0.3.34"
futures-channel = "0.3.30"
async-stream = "0.3.5"
reqwest = "0.13.5"
rust_decimal = "1.43.0"
serde = "1.0.229"
serde_json = "1.0.154"
sqlx = "0.9.0"
thiserror = "2.0.21"
tokio = "1.54.1"
tokio-stream = "0.1.19"
tokio-tungstenite = "0.30.0"
uuid = "1.29.2"

# graphical interfaces
leptos = "0.8.23"
leptos_axum = "0.8.10"
leptos-chartistry = "0.2.3"
leptos_meta = "0.8.7"
leptos_router = "0.8.17"
trading-charts = "1.0.0"
wasm-bindgen = "0.2.130"

# observability and tracing
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
logfire = "0.14.0"