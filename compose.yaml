services:
  datastore:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - PGDATA=/pgdata
      - POSTGRES_DB=collector
      - POSTGRES_PASSWORD=password
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    container_name: server
    build:
      context: .
      target: final
      dockerfile: Docker/Dockerfile.Server
    ports:
      - "8080:8080"
    environment:
      - ENVIRONMENT=test
      - HOST=noneatthemoment
      - OTEL_SERVICE_NAME=server
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://observability:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
    depends_on:
      datastore:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    build:
      context: .
      dockerfile: Docker/Dockerfile.Migrate
    environment:
      - DATABASE_URL=postgres://postgres:password@datastore:5432
    depends_on:
      datastore:
        condition: service_healthy

  collector:
    container_name: collector
    build:
      context: .
      target: final
      dockerfile: Docker/Dockerfile.Collector
    environment:
      - APP_ENVIRONMENT=test
      - APP_BINANCE__WS_URL=wss://stream.binance.us:9443
      - APP_BINANCE__MAX_CONNECTION_ATTEMPTS=3
      - APP_DATABASE__URL=postgres://postgres:password@datastore:5432
      - APP_DATABASE__MAX_CONNECTIONS=8
      - OTEL_SERVICE_NAME=collector
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://observability:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
    depends_on:
      migrate:
        condition: service_completed_successfully
      observability:
        condition: service_started

  observability:
    image: grafana/otel-lgtm:latest
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
