services:
  datastore:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - PGDATA=/pgdata
      - POSTGRES_DB=collector
      - POSTGRES_PASSWORD=password
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    container_name: server
    build:
      context: .
      target: final
      dockerfile: Docker/Dockerfile.Server
    ports:
      - "8080:8080"
    environment:
      - APP_ENVIRONMENT=test
      - APP_HTTP__ADDRESS=0.0.0.0
      - APP_HTTP__PORT=8080
      - APP_DATABASE__URL=postgres://postgres:password@datastore:5432
      - APP_DATABASE__MAX_CONNECTIONS=8
      - OTEL_SERVICE_NAME=server
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://observability:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/api/health"]
      start_period: 5s
      interval: 60s
      timeout: 5s
      retries: 5
    depends_on:
      datastore:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  dashboard:
    container_name: dashboard
    build:
      context: .
      target: final
      dockerfile: Docker/Dockerfile.Dashboard
    ports:
      - "9090:9090"
    environment:
      - TRUNK_SERVE_ADDRESSES=0.0.0.0
    depends_on:
      server:
        condition: service_healthy # todo: healthcheck for server

  migrate:
    build:
      context: .
      target: final
      dockerfile: Docker/Dockerfile.Migrate
    environment:
      - DATABASE_URL=postgres://postgres:password@datastore:5432
    depends_on:
      datastore:
        condition: service_healthy

  collector:
    container_name: collector
    build:
      context: .
      target: final
      dockerfile: Docker/Dockerfile.Collector
    environment:
      - APP_ENVIRONMENT=test
      - APP_BINANCE__WS_URL=wss://stream.binance.us:9443
      - APP_BINANCE__MAX_CONNECTION_ATTEMPTS=3
      - APP_DATABASE__URL=postgres://postgres:password@datastore:5432
      - APP_DATABASE__MAX_CONNECTIONS=8
      - OTEL_SERVICE_NAME=collector
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://observability:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - RUST_LOG=debug
    depends_on:
      migrate:
        condition: service_completed_successfully
      observability:
        condition: service_started

  observability:
    image: grafana/otel-lgtm:latest
    ports:
      - "3000:3000" # Grafana Web UI
      - "4317:4317" # OTLP gRPC endpoint
      - "4318:4318" # OTLP HTTP endpoint
